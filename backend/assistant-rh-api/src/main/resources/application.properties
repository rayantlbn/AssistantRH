spring.application.name=assistant-rh-api-v2

server.port=${SERVER_PORT:8080}

# Base de données PostgreSQL (valeurs par défaut alignées sur compose.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assistant_rh}
spring.datasource.username=${DB_USERNAME:assistant_rh}
spring.datasource.password=${DB_PASSWORD:assistant_rh}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Entreprise unique de la Phase 1, créée au démarrage si la table est vide
app.company.name=${COMPANY_NAME:Mon entreprise}

# Pagination de l'API : format {content, page{size, number, totalElements, totalPages}}, 100 éléments max
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100
