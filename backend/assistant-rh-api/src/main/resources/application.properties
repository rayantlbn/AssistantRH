spring.application.name=assistant-rh-api-v2

server.port=${SERVER_PORT:8080}

# Base de données PostgreSQL (valeurs par défaut alignées sur compose.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assistant_rh}
spring.datasource.username=${DB_USERNAME:assistant_rh}
spring.datasource.password=${DB_PASSWORD:assistant_rh}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Entreprise unique de la Phase 1, créée au démarrage si la table est vide
app.company.name=${COMPANY_NAME:Mon entreprise}

# Pagination de l'API : format {content, page{size, number, totalElements, totalPages}}, 100 éléments max
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

# Documentation OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Stockage des CV sur disque (docs/architecture.md, section 8)
app.storage.upload-dir=${UPLOAD_DIR:uploads}

# Upload : 5 Mo par fichier (DOC-01). Tomcat lit le corps d'une requête trop grosse jusqu'à 10 Mo
# pour pouvoir répondre 400 proprement au lieu de couper la connexion.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=10MB

# CORS : origines autorisées à appeler /api/** (séparées par des virgules). Défaut : frontend Vite en local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
