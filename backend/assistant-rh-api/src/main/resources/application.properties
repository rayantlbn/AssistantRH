spring.application.name=assistant-rh-api-v2

server.port=${SERVER_PORT:8080}

# Base de données PostgreSQL (valeurs par défaut alignées sur compose.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assistant_rh}
spring.datasource.username=${DB_USERNAME:assistant_rh}
spring.datasource.password=${DB_PASSWORD:assistant_rh}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
